name: Env Secret

on: 
  push:
  workflow_dispatch:
env:
  GLOBAL_APP_ENV: global level env

jobs:
  build:
     runs-on: ubuntu-latest
     env:
       JOB_APP_ENV: Job level env
     steps:
       - name: Say Hello
         run: echo "Hello from the env secret"
       - name: install
         env:
           APP_ENV: steps level env
           DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
         run: echo "Environment $APP_ENV USING $DB_PASSWORD, $GLOBAL_APP_ENV, $JOB_APP_ENV"
         
      
