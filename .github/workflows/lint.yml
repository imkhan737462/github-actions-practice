#Goal: whenever someone changes the python code the linter will check syntax format and indention correct or not

name: Auto Linter
on:
  push:
    paths: "*.py"
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
    # this steps will clone the code
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
        
        #this steps will install pip run which is python linter
      - name: Install Linter
        run: pip install ruff
        
          
