name: Hello Spring Boot App To Docker
on:
  push:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and Test (maven)
        working-directory: ./devops-project
        run: mvn -B clean verify

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./devops-project/target/surefire-reports


  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Build JAR for Docker
        working-directory: ./devops-project
        run: mvn -B clean package -DskipTests

      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./devops-project
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:${{ github.sha }}


